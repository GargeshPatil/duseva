services:
  - type: web
    name: duseva-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: CORS_ORIGIN
        value: https://duseva.in
      - key: PYTHON_VERSION
        value: 3.11.9
